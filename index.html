<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>依恋风格测试 · 静静说</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(180deg,#f7f4ff 0%,#fff 48%,#f6fbff 100%);color:#17162f;min-height:100vh;padding:2rem 1rem}
.wrap{max-width:600px;margin:0 auto}
.header{text-align:center;margin-bottom:2rem}
.tag{display:inline-block;background:#e8e4ff;color:#4539a8;font-size:12px;padding:4px 14px;border-radius:99px;margin-bottom:1rem;font-weight:700}
.authority{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;color:#68627f;margin-bottom:1rem;flex-wrap:wrap}
.authority-dot{width:5px;height:5px;background:#6657d8;border-radius:50%;flex-shrink:0}
h1{font-size:22px;font-weight:600;color:#1a1a2e;margin-bottom:.5rem}
.subtitle{font-size:14px;color:#5f5b73;line-height:1.7}
.progress-wrap{margin-bottom:1.5rem}
.progress-bar{background:#ded8fb;border-radius:99px;height:8px;overflow:hidden;margin-bottom:.5rem}
.progress-fill{height:100%;background:linear-gradient(90deg,#7567e8,#4335b5);border-radius:99px;transition:width .4s ease}
.progress-text{font-size:11px;color:#6f6790;text-align:right;font-weight:700}
.section-label{font-size:11px;color:#716b86;letter-spacing:.08em;margin-bottom:.75rem;text-transform:uppercase;font-weight:700}
.question-card{background:#fff;border:1px solid #e5e0fb;border-radius:18px;padding:1.5rem;margin-bottom:1rem;box-shadow:0 12px 36px rgba(61,49,142,.09)}
.question-num{font-size:11px;color:#6a5dd4;margin-bottom:.5rem;font-weight:700}
.question-text{font-size:15px;color:#2d2d4e;line-height:1.8;margin-bottom:1.25rem}
.scale-wrap{display:flex;gap:6px}
.scale-btn{flex:1;height:42px;border:1px solid #ddd7fb;border-radius:12px;background:#fbfaff;cursor:pointer;font-size:13px;color:#615c76;transition:all .2s;-webkit-tap-highlight-color:transparent;font-weight:600}
.scale-btn:active{transform:scale(.93)}
.scale-btn.selected{background:#e7e3ff;border-color:#6657d8;color:#342a91;font-weight:800;box-shadow:0 5px 14px rgba(84,71,196,.24)}
.scale-labels{display:flex;justify-content:space-between;font-size:11px;color:#716b86;margin-top:.6rem}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:1.5rem}
.btn{padding:.65rem 1.5rem;border-radius:12px;border:1px solid #ddd7fb;background:#fff;cursor:pointer;font-size:14px;color:#514b68;transition:all .2s;font-weight:600}
.btn:active{transform:scale(.97)}
.btn-primary{background:#4637b8;border-color:#4637b8;color:#fff;box-shadow:0 8px 18px rgba(70,55,184,.3)}
.btn-primary:active{background:#3C3489}
.btn:disabled{opacity:.3;cursor:not-allowed}
.counter{font-size:13px;color:#716b86}
.result-hero{text-align:center;padding:1.5rem 0 1rem}
.result-badge{display:inline-block;background:#e7e3ff;color:#4539a8;font-size:11px;padding:5px 14px;border-radius:99px;margin-bottom:1rem;font-weight:800}
.result-type{font-size:32px;font-weight:800;color:#382a9c;margin-bottom:.5rem;letter-spacing:0}
.result-core{font-size:16px;color:#38344e;line-height:1.75;margin-bottom:1.5rem;font-weight:600}
.chart-wrap{background:#fff;border:1px solid #ded8fb;border-radius:18px;padding:1.5rem;margin-bottom:1.25rem;box-shadow:0 16px 42px rgba(61,49,142,.11)}
.chart-title{font-size:15px;font-weight:800;color:#262342;margin-bottom:1.15rem;text-align:center}
.dim-row{margin-bottom:1.15rem}
.dim-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:.5rem;align-items:center}
.dim-name{color:#262342;font-weight:700}
.dim-val{color:#392da5;font-weight:800}
.dim-bar{background:#ded8fb;border-radius:99px;height:12px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(40,31,120,.12)}
.dim-fill{height:100%;border-radius:99px;transition:width .8s ease}
.fill-anxiety{background:linear-gradient(90deg,#8b7cf4,#4a39bd)}
.fill-avoidance{background:linear-gradient(90deg,#6fc7d9,#2a82a2)}
.dim-desc{font-size:12px;color:#5f5a76;margin-top:.4rem;line-height:1.55}
.quadrant{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#d6d1f4;border:1px solid #d6d1f4;border-radius:14px;overflow:hidden;margin-top:1.1rem}
.quad-cell{background:#fbfaff;padding:.95rem .75rem;text-align:center;font-size:11px;color:#6a647d;min-height:72px}
.quad-cell.active{background:linear-gradient(135deg,#ddd8ff,#f2f0ff);box-shadow:inset 0 0 0 2px #6657d8;position:relative}
.quad-cell.active .quad-name{color:#342a91;font-weight:800}
.quad-name{font-size:13px;color:#4b465f;display:block;margin-bottom:.25rem;font-weight:700}
.quad-dot{width:9px;height:9px;background:#4335b5;border-radius:50%;display:inline-block;margin-top:.35rem;box-shadow:0 0 0 4px rgba(67,53,181,.16)}
.authority-block{background:#f1efff;border:1px solid #ded8fb;border-radius:14px;padding:1rem;margin-top:1rem;font-size:12px;color:#5f5a76;line-height:1.75;text-align:center;font-weight:600}
.result-block{background:#fff;border:1px solid #ded8fb;border-radius:18px;padding:1.5rem;margin-bottom:1.25rem;box-shadow:0 14px 34px rgba(61,49,142,.09)}
.result-block h3{font-size:15px;font-weight:600;color:#2d2d4e;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.block-icon{width:24px;height:24px;background:#e7e3ff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.result-block p{font-size:14px;color:#3f3a52;line-height:1.9;margin-bottom:.75rem}
.result-block p:last-child{margin-bottom:0}
.result-block .warm{color:#3b2fa4;font-size:14px;font-weight:700;line-height:1.8}
.trait-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:.75rem}
.trait-tag{background:#f1efff;border:1px solid #d8d1fb;border-radius:99px;padding:5px 12px;font-size:12px;color:#4234aa;font-weight:700}
.cta{background:linear-gradient(135deg,#e8e4ff,#f7fcff);border:1px solid #cfc8f5;border-radius:18px;padding:1.75rem;text-align:center;margin-bottom:1.5rem;box-shadow:0 14px 34px rgba(61,49,142,.1)}
.cta-avatar{width:52px;height:52px;background:#4637b8;border-radius:50%;margin:0 auto 1rem;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:700}
.cta h3{font-size:16px;font-weight:600;color:#2d2d4e;margin-bottom:.5rem}
.cta p{font-size:13px;color:#4d4860;line-height:1.8;margin-bottom:1.25rem}
.cta-keyword{display:inline-block;background:#4637b8;color:#fff;padding:7px 22px;border-radius:99px;font-size:14px;font-weight:800;margin-bottom:1rem;box-shadow:0 8px 16px rgba(70,55,184,.22)}
.cta-note{font-size:12px;color:#665f7c}
.btn-restart{width:100%;padding:.75rem;border-radius:12px;border:1px solid #d8d1fb;background:#fff;cursor:pointer;font-size:14px;color:#514b68;margin-top:.75rem;font-weight:700}
.footer{text-align:center;margin-top:2rem;margin-bottom:1rem;font-size:11px;color:#8a849b;line-height:1.8}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div id="quiz-section">
    <div class="header">
      <div class="tag">依恋风格自测</div>
      <div class="authority">
        <span class="authority-dot"></span>
        <span>基于ECR量表 · Brennan, Clark & Shaver (1998)</span>
        <span class="authority-dot"></span>
        <span>全球心理学研究广泛引用</span>
      </div>
      <h1>你在亲密关系里，是哪种依恋风格？</h1>
      <p class="subtitle">共18题，约3分钟。<br>请根据你在亲密关系中的真实感受作答，没有对错之分。</p>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progress" style="width:5.5%"></div></div>
      <div class="progress-text" id="progress-text">1 / 18</div>
    </div>
    <div id="questions-wrap"></div>
    <div class="nav">
      <button class="btn" id="prev-btn" onclick="navigate(-1)" disabled>← 上一题</button>
      <span class="counter" id="counter"></span>
      <button class="btn btn-primary" id="next-btn" onclick="navigate(1)">下一题 →</button>
    </div>
  </div>
  <div id="result-section" style="display:none"></div>
  <div class="footer">静静说 · 用心理学帮你看懂关系<br>本测试仅供参考，不构成心理诊断</div>
</div>

<script>
const questions=[
  {id:1,text:"我很担心被伴侣抛弃。",dim:"anxiety"},
  {id:2,text:"当伴侣不在身边时，我会担心他/她可能对别人产生兴趣。",dim:"anxiety"},
  {id:3,text:"我发现自己很难完全依赖伴侣。",dim:"avoidance"},
  {id:4,text:"我宁愿不把内心感受展示给伴侣看。",dim:"avoidance"},
  {id:5,text:"我很担心伴侣不像我在乎他/她那样在乎我。",dim:"anxiety"},
  {id:6,text:"我觉得和伴侣亲密让我不舒服。",dim:"avoidance"},
  {id:7,text:"当我需要伴侣时，他/她总是不在。",dim:"anxiety"},
  {id:8,text:"我想和伴侣非常亲密，但这反而让他/她走远。",dim:"anxiety"},
  {id:9,text:"我不喜欢在情感上依赖别人。",dim:"avoidance"},
  {id:10,text:"我担心如果失去伴侣的爱，我会崩溃。",dim:"anxiety"},
  {id:11,text:"我觉得向伴侣敞开心扉很困难。",dim:"avoidance"},
  {id:12,text:"我反复想着伴侣是否真的爱我。",dim:"anxiety"},
  {id:13,text:"与伴侣过于亲密会让我感到不安。",dim:"avoidance"},
  {id:14,text:"当我表现出需要伴侣时，我担心他/她会离开。",dim:"anxiety"},
  {id:15,text:"我尽量避免与伴侣过于亲密。",dim:"avoidance"},
  {id:16,text:"我担心自己不够好，不值得被爱。",dim:"anxiety"},
  {id:17,text:"我不愿意让伴侣了解我内心真实的想法。",dim:"avoidance"},
  {id:18,text:"伴侣一旦冷淡，我会感到非常不安。",dim:"anxiety"}
];

const typeData={
  anxious:{
    name:"焦虑型依恋",
    core:"你比任何人都渴望被爱，也比任何人都害怕失去。",
    traits:["患得患失","反复确认","害怕被抛下","容易内耗","对冷淡极度敏感"],
    detail:`你的情感神经系统长期处于高度警觉状态，像一个永远不能关闭的雷达，持续扫描关系中的每一个细节。

你对伴侣的情绪变化极其敏感，任何细微的冷淡、距离感或回应迟缓，都会被自动解读为"我要被抛下了"的信号。这种解读不经过理性判断，它是即时的、难以控制的。

你渴望亲密，但这种渴望本身让你痛苦。你越在乎一个人，越容易失去自我——开始讨好，开始压抑真实需求，开始把对方的感受放在自己之上。你以为这是爱，但其实是恐惧在驱动你。

你的安全感完全依附于对方的态度。他热情，你安心；他冷淡，你崩溃。你无法从内部给自己提供稳定感，只能不断向外寻求确认。但这种确认永远填不满，因为真正的漏洞在你内心对自己的不信任。

你内心有一个根深蒂固的信念：我不够好，所以随时可能被抛弃。这让你用过度付出、反复确认、情绪内耗来对抗失控的恐惧。你越努力抓住，越感觉抓不住。

你不是太敏感，也不是太作。你只是从来没有学会，如何在关系里感到真正安全。`,
    grow:"你真正需要的，不是一个更能「接住你」的人，而是慢慢建立属于自己的内在安全感。当你开始相信，就算有人离开，你依然是完整的——那种焦虑，才会慢慢松动。",
    partner:"你最容易被回避型吸引——他的若即若离，恰好触发了你最深的恐惧，让你欲罢不能。"
  },
  avoidant:{
    name:"回避型依恋",
    core:"你渴望爱，但每当爱真的靠近，你又想逃。",
    traits:["习惯独立","不擅表达","亲密让你不安","需要个人空间","不喜欢依赖"],
    detail:`你高度重视自主性，亲密关系对你而言常常意味着一种隐性威胁——失去边界，失去掌控，失去属于自己的内心空间。

当伴侣靠近、表达需求或期待情感回应时，你会产生本能的退缩冲动。这不是冷漠，而是你的神经系统在用"保持距离"来维持内心的平衡。对你来说，退后一步，才能呼吸。

你习惯独立处理情绪，不擅长也不愿意向他人展示脆弱。你相信依赖是危险的，所以把"不需要别人"训练成了一种生存方式。这让你看起来坚强，但也让你越来越难以被真正触碰。

但这副独立的外壳之下，你同样渴望被理解、被接纳。只是每当有人真正靠近，你就会感到窒息，然后后退。

你在关系里最大的困境是：你无法同时拥有亲密和安全感。靠近让你焦虑，孤独让你空洞。你在这两种感受之间反复拉扯，却很难对伴侣解释清楚为什么。`,
    grow:"试着练习一件小事：把一个真实的感受说出来，哪怕只是一句话。不需要一下子全部打开，一点点来，就好。",
    partner:"你最容易和焦虑型在一起——一个追，一个逃，像一场永远跳不完的舞。"
  },
  fearful:{
    name:"恐惧型依恋",
    core:"你想要爱，又怕爱。你靠近，又逃跑。",
    traits:["渴望又恐惧亲密","容易受伤","关系里常常矛盾","不相信自己值得被爱","情绪起伏大"],
    detail:`你同时携带着高焦虑和高回避，这让你成为四种类型中内心最撕裂的一种。

你渴望亲密，却把亲密本身视为危险。你害怕被抛弃，同时也害怕真正被爱——因为一旦被爱，就意味着你有更多可以失去的东西。

在关系里，你陷入一种自我矛盾的循环：伴侣靠近时，你感到焦虑；伴侣退远时，你陷入恐慌。你找不到一个让自己真正安全的位置。

你内心有一个核心信念：我不值得被爱，而且爱本身是会伤人的。这让你在关系中主动制造距离，或者用激烈的情绪反应来测试对方是否真的会留下来。

你比任何人都清楚这种拉扯有多累。你不是不想稳定，你只是还不知道怎么相信，靠近一个人是安全的。`,
    grow:"你值得一段稳定的关系。改变从承认开始：你既需要爱，也害怕爱——这两件事可以同时存在，你不需要为此责怪自己。",
    partner:"你的关系模式比较复杂，通常需要更多时间和耐心，来慢慢建立对他人的信任。"
  },
  secure:{
    name:"安全型依恋",
    core:"你在关系里，相对稳定，相对自在。",
    traits:["情绪稳定","能表达需求","给伴侣空间","不容易患得患失","有自我边界"],
    detail:`你拥有稳定的内在基础，这让你在关系中不容易被外部波动所淹没。

你能清晰感知并表达自己的情绪需求，同时也能给伴侣足够的空间，不会因为对方需要独处而产生被抛弃的恐惧。

你对关系有基本的信任感——你相信矛盾是可以解决的，距离是暂时的，对方的冷淡不一定意味着关系出了问题。这种信任让你在冲突中能保持相对的冷静和理性。

你在关系里有清晰的自我边界，不会为了维持关系而失去自我，也不会为了保持独立而拒绝真正的亲密。

安全型不代表你没有需求，也不代表你不会受伤。它只是意味着，你有能力在受伤之后重新站稳，而不是崩塌。`,
    grow:"继续保持这种稳定。同时可以学习理解身边焦虑型或回避型的伴侣——他们的痛苦是真实的，只是需要更多耐心。",
    partner:"你和大多数依恋类型都能相处，但最好的匹配，是另一个安全型，或者愿意认真成长的人。"
  }
};

const answers={};
let current=0;

function getType(anx,avo){
  const ha=anx>=4,hav=avo>=4;
  if(ha&&!hav)return'anxious';
  if(!ha&&hav)return'avoidant';
  if(ha&&hav)return'fearful';
  return'secure';
}

function render(){
  const q=questions[current];
  const val=answers[q.id]||null;
  document.getElementById('questions-wrap').innerHTML=`
    <div class="section-label">${q.dim==='anxiety'?'关系中的感受':'亲密与距离'}</div>
    <div class="question-card">
      <div class="question-num">第 ${current+1} 题</div>
      <div class="question-text">${q.text}</div>
      <div class="scale-wrap">${[1,2,3,4,5,6,7].map(n=>`<button class="scale-btn${val===n?' selected':''}" onclick="pick(${q.id},${n})">${n}</button>`).join('')}</div>
      <div class="scale-labels"><span>完全不符合</span><span>完全符合</span></div>
    </div>`;
  const pct=Math.round(((current+1)/questions.length)*100);
  document.getElementById('progress').style.width=pct+'%';
  document.getElementById('progress-text').textContent=`${current+1} / ${questions.length}`;
  document.getElementById('prev-btn').disabled=current===0;
  const last=current===questions.length-1;
  document.getElementById('next-btn').textContent=last?'查看结果 →':'下一题 →';
}

function pick(id,val){
  answers[id]=val;
  render();
  if(current<questions.length-1)setTimeout(()=>navigate(1),280);
}

function navigate(dir){
  if(dir===1&&current===questions.length-1){showResult();return;}
  if(dir===1&&!answers[questions[current].id])return;
  current=Math.max(0,Math.min(questions.length-1,current+dir));
  render();
}

function showResult(){
  if(Object.keys(answers).length<questions.length){alert('请完成所有题目');return;}
  let at=0,ac=0,vt=0,vc=0;
  questions.forEach(q=>{
    if(q.dim==='anxiety'){at+=answers[q.id];ac++;}
    else{vt+=answers[q.id];vc++;}
  });
  const as=parseFloat((at/ac).toFixed(1));
  const vs=parseFloat((vt/vc).toFixed(1));
  const t=getType(as,vs);
  const d=typeData[t];
  const anxPct=Math.round((as/7)*100);
  const avoPct=Math.round((vs/7)*100);
  const isAnxious=t==='anxious'||t==='fearful';
  const isAvoidant=t==='avoidant'||t==='fearful';
  const q1=!isAnxious&&!isAvoidant;
  const q2=isAnxious&&!isAvoidant;
  const q3=!isAnxious&&isAvoidant;
  const q4=isAnxious&&isAvoidant;

  document.getElementById('quiz-section').style.display='none';
  const rs=document.getElementById('result-section');
  rs.style.display='block';
  rs.innerHTML=`
    <div class="result-hero">
      <div class="result-badge">你的测试结果</div>
      <div class="result-type">${d.name}</div>
      <div class="result-core">${d.core}</div>
    </div>

    <div class="chart-wrap">
      <div class="chart-title">你的依恋维度分析</div>
      <div class="dim-row">
        <div class="dim-label"><span class="dim-name">依恋焦虑</span><span class="dim-val">${as} / 7</span></div>
        <div class="dim-bar"><div class="dim-fill fill-anxiety" style="width:${anxPct}%"></div></div>
        <div class="dim-desc">得分越高，越容易在关系中患得患失、害怕被抛下</div>
      </div>
      <div class="dim-row">
        <div class="dim-label"><span class="dim-name">依恋回避</span><span class="dim-val">${vs} / 7</span></div>
        <div class="dim-bar"><div class="dim-fill fill-avoidance" style="width:${avoPct}%"></div></div>
        <div class="dim-desc">得分越高，越倾向于在关系中保持距离、不擅表达情感</div>
      </div>
      <div class="quadrant">
        <div class="quad-cell${q1?' active':''}"><span class="quad-name">安全型</span><span style="font-size:10px">低焦虑·低回避</span>${q1?'<br><span class="quad-dot"></span>':''}</div>
        <div class="quad-cell${q3?' active':''}"><span class="quad-name">回避型</span><span style="font-size:10px">低焦虑·高回避</span>${q3?'<br><span class="quad-dot"></span>':''}</div>
        <div class="quad-cell${q2?' active':''}"><span class="quad-name">焦虑型</span><span style="font-size:10px">高焦虑·低回避</span>${q2?'<br><span class="quad-dot"></span>':''}</div>
        <div class="quad-cell${q4?' active':''}"><span class="quad-name">恐惧型</span><span style="font-size:10px">高焦虑·高回避</span>${q4?'<br><span class="quad-dot"></span>':''}</div>
      </div>
      <div class="authority-block">基于 ECR 亲密关系经历量表<br>Brennan, Clark & Shaver (1998)<br>全球超过 10,000 项心理学研究引用的依恋测量工具</div>
    </div>

    <div class="result-block">
      <h3><span class="block-icon">🪞</span>你在关系里是什么样的</h3>
      <div class="trait-list">${d.traits.map(tr=>`<span class="trait-tag">${tr}</span>`).join('')}</div>
      ${d.detail.split('\n\n').map(p=>`<p>${p}</p>`).join('')}
    </div>

    <div class="result-block">
      <h3><span class="block-icon">✨</span>慢慢来，可以改变的</h3>
      <p class="warm">${d.grow}</p>
      <p style="font-size:13px;color:#bbb">${d.partner}</p>
    </div>

    <div class="cta">
      <div class="cta-avatar">静</div>
      <h3>想聊聊你的关系困局？</h3>
      <p>测试能告诉你你是哪种类型，但它不知道你经历了什么，你为什么这么痛。<br><br>如果你想有人帮你看清楚，你们之间到底发生了什么——</p>
      <div class="cta-keyword">评论或私信「分析」</div>
      <p class="cta-note">静静会用心理学视角，帮你拆解你的关系模式</p>
      <button class="btn-restart" onclick="restart()">重新测试</button>
    </div>`;
}

function restart(){
  Object.keys(answers).forEach(k=>delete answers[k]);
  current=0;
  document.getElementById('result-section').style.display='none';
  document.getElementById('quiz-section').style.display='block';
  render();
}

render();
</script>
</body>
</html>
